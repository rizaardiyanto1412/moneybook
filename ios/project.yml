# Generates Moneybook.xcodeproj: `xcodegen` (brew install xcodegen). See README.md.
name: Moneybook
options:
  bundleIdPrefix: app.moneybook
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
packages:
  MoneybookKit:
    path: ../mac
targets:
  MoneybookiOS:
    type: application
    platform: iOS
    sources: [Moneybook]
    dependencies:
      - package: MoneybookKit
        product: MoneybookCore
      - package: MoneybookKit
        product: MoneybookClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        PRODUCT_NAME: Moneybook
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Moneybook
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo of a receipt to attach it to a transaction.
  MoneybookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MoneybookUITests]
    dependencies:
      - target: MoneybookiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MoneybookiOS
schemes:
  MoneybookiOS:
    build:
      targets:
        MoneybookiOS: all
    test:
      targets: [MoneybookUITests]
      environmentVariables:
        TEST_SERVER: $(TEST_SERVER)
        TEST_TOKEN: $(TEST_TOKEN)
